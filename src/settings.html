<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réglages — Salaat Widget</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div id="wrap">
    <h1 id="i-title">Réglages</h1>
    <form id="settings-form">
    <label>
      <span id="i-city">Ville</span>
      <input id="city" type="text" placeholder="Paris" autocomplete="off" />
    </label>
    <div class="row">
      <label>
        <span id="i-latitude">Latitude</span>
        <input id="lat" type="number" step="0.0001" min="-90" max="90" required />
      </label>
      <label>
        <span id="i-longitude">Longitude</span>
        <input id="lon" type="number" step="0.0001" min="-180" max="180" required />
      </label>
    </div>
    <button type="button" id="locate">Utiliser ma position</button>

    <label>
      <span id="i-method">Méthode de calcul</span>
      <select id="method">
        <option value="12">UOIF (France)</option>
        <option value="21">Maroc (Ministère des Habous)</option>
        <option value="3">Muslim World League</option>
        <option value="2">ISNA (Amérique du Nord)</option>
        <option value="1">Université de Karachi</option>
        <option value="4">Umm Al-Qura (La Mecque)</option>
        <option value="5">Égypte (EGA)</option>
        <option value="19">Algérie</option>
        <option value="18">Tunisie</option>
        <option value="8">Golfe</option>
        <option value="9">Koweït</option>
        <option value="10">Qatar</option>
        <option value="11">Singapour</option>
        <option value="16">Dubaï</option>
        <option value="17">JAKIM (Malaisie)</option>
        <option value="20">KEMENAG (Indonésie)</option>
        <option value="22">Portugal</option>
        <option value="23">Jordanie</option>
        <option value="13">Diyanet (Turquie)</option>
        <option value="14">Russie</option>
        <option value="7">Téhéran</option>
        <option value="0">Jafari (Chiite)</option>
      </select>
    </label>

    <label>
      <span id="i-school">École (Asr)</span>
      <select id="school">
        <option value="0">Générale (Chaféite…)</option>
        <option value="1">Hanafite</option>
      </select>
    </label>

    <label>
      <span id="i-highlat">Règle hautes latitudes</span>
      <select id="high-lat">
        <option value="2">Méthode angulaire</option>
        <option value="0">Milieu de la nuit</option>
        <option value="1">Septième de la nuit</option>
      </select>
    </label>

    <label>
      <span id="i-language">Langue</span>
      <select id="language">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>
    </label>

    <label>
      <span id="i-hour">Format de l'heure</span>
      <select id="hour12">
        <option value="false">24 h</option>
        <option value="true">12 h (AM/PM)</option>
      </select>
    </label>

    <label class="check">
      <input type="checkbox" id="autostart" />
      <span id="i-autostart">Démarrer avec Windows</span>
    </label>
    <label class="check">
      <input type="checkbox" id="start-hidden" />
      <span id="i-starthidden">Démarrer masqué (prochain démarrage)</span>
    </label>

    <p id="error" class="error hidden"></p>

    <div class="actions">
      <span id="saved-hint" class="saved-hint hidden">✓ Enregistré</span>
      <button type="button" id="cancel">Fermer</button>
    </div>
  </form>
  </div>
  <script src="settings.js"></script>
</body>
</html>
