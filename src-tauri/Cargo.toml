[package]
name = "salaat-widget"
version = "0.1.0"
description = "A taskbar widget for Islamic prayer times (Windows), offline-first"
authors = ["Ismail Bahloul"]
edition = "2021"

[lib]
name = "salaat_widget_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
salaat-core = { path = "../crates/salaat-core" }
dirs = "5"

[target.'cfg(windows)'.dependencies]
# Win32 integration (no-focus HUD, real taskbar position, fullscreen auto-hide).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
